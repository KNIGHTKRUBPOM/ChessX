name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: '1'
      CHESS_TEST_SUPABASE: '1'
      CHESS_QA_RUN: chessx-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: '3.1.0'
      - run: npm ci
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Start local Supabase and Mailpit
        run: |
          supabase start > "$RUNNER_TEMP/chess-e2e-start.log" 2>&1 || {
            echo "::error::The local Supabase stack did not start."
            exit 1
          }
          supabase db reset
      - run: npm run test:e2e
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            qa-report/evidence/chessx-ci-*/
          if-no-files-found: ignore
          retention-days: 5
      - name: Stop local services
        if: always()
        run: supabase stop
