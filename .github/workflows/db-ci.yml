name: Database CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: db-ci-${{ github.workflow }}-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  migration-and-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: '1'
      CHESS_TEST_SUPABASE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: '3.1.0'
      - run: npm ci
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - name: Start local services and apply migrations from zero
        run: |
          supabase start > "$RUNNER_TEMP/chess-db-start.log" 2>&1 || {
            echo "::error::The local Supabase stack did not start. Check config.toml, Docker images and ports."
            exit 1
          }
          supabase db reset
      - run: supabase db lint --schema public,chessmess_private --fail-on warning
      - run: supabase test db
      - name: Reject migration drift
        run: |
          diff_file="$RUNNER_TEMP/chess-schema-drift.sql"
          touch "$diff_file"
          supabase db diff --from migrations --to local --schema public,chessmess_private --output "$diff_file"
          if grep -qEv '^[[:space:]]*(--.*)?$' "$diff_file"; then
            echo "::error::Schema drift found. Add the missing schema changes to a migration."
            exit 1
          fi
      - run: npm run db:types:check
      - run: npm run test:integration
      - name: Stop local services
        if: always()
        run: supabase stop
