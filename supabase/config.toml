project_id = "chessx-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3210"
additional_redirect_urls = ["http://127.0.0.1:3210/api/account/oauth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "รหัสยืนยันบัญชี ChessMess"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "รหัสตั้งรหัสผ่านใหม่ ChessMess"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "รหัสยืนยันการเปลี่ยนอีเมล ChessMess"
content_path = "./supabase/templates/email-change.html"

[auth.email.notification.password_changed]
enabled = true

[auth.email.notification.email_changed]
enabled = true

[auth.email.notification.mfa_factor_enrolled]
enabled = true

[auth.email.notification.mfa_factor_unenrolled]
enabled = true

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.facebook]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET)"
